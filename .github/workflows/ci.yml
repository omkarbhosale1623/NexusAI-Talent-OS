name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexusai
          POSTGRES_PASSWORD: nexusai
          POSTGRES_DB: nexusai_talent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusai -d nexusai_talent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://nexusai:nexusai@localhost:5432/nexusai_talent
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-jwt-secret-not-for-production
          # Valid Fernet key (urlsafe base64, 32 bytes) so app.core.crypto works in CI.
          ENCRYPTION_KEY: zZ2vH1nQ9k3mX7tY0pL5sR8wB4cD6fG1jK2lM3nO4pQ=
        run: pytest

  backend-lint:
    name: Backend lint and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff and pip-audit
        run: pip install ruff pip-audit

      # ruff.toml exists in backend/, so plain `ruff check app` uses it.
      # If config were missing this stays lenient (real errors only):
      #   ruff check app --select E9,F63,F7,F82
      - name: Ruff check (app)
        run: ruff check app

      - name: pip-audit (non-blocking)
        continue-on-error: true
        run: |
          echo "Running pip-audit on backend/requirements.txt (report-only)"
          pip-audit -r requirements.txt || echo "pip-audit reported findings (non-blocking)"

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npx next build

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: nexusai-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: nexusai-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan (report-only)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
          format: table