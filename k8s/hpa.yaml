# Horizontal Pod Autoscalers for the stateless web tiers.
# Requires metrics-server to be installed in the cluster.
# CPU target 70%, min 2 / max 10 replicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: nexusai
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: nexusai-talent-os
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: nexusai
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: nexusai-talent-os
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
