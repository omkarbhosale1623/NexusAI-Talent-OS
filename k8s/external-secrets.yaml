# =====================================================================
#  External Secrets Operator (ESO) — EXAMPLE. NOT applied by default.
# =====================================================================
# This shows how to source the `nexusai-secrets` Secret from a real secret
# manager instead of the checked-in placeholder secret.yaml.
#
# REQUIRES: the External Secrets Operator and its CRDs installed in the
# cluster (https://external-secrets.io). Because the CRDs
# (SecretStore / ExternalSecret) are not present on a vanilla cluster, this
# file is intentionally EXCLUDED from kustomization.yaml — `kubectl
# kustomize`/`apply -k` against a cluster without ESO would fail to find
# the types.
#
# When you adopt ESO:
#   1. Install ESO + CRDs.
#   2. Pick ONE backend below (AWS Secrets Manager OR Vault), fill it in,
#      delete the other, and create the referenced auth Secret.
#   3. Remove secret.yaml from kustomization.yaml so the placeholder Secret
#      no longer overwrites the ESO-generated one (ESO will CREATE and own
#      `nexusai-secrets`).
#   4. Add this file to kustomization.yaml's resources.
#
# The generated Secret's name/keys MUST match what the workloads consume:
#   name: nexusai-secrets  (see backend.yaml/celery-worker.yaml secretRef)
#   keys: JWT_SECRET, SECRET_KEY, DATABASE_URL, POSTGRES_USER,
#         POSTGRES_PASSWORD, POSTGRES_DB, LLM_API_KEY, OPENAI_API_KEY, ...

# ── Option A: AWS Secrets Manager ────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: nexusai-aws-secretsmanager
  namespace: nexusai
  labels:
    app.kubernetes.io/part-of: nexusai-talent-os
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1            # <-- set your region
      auth:
        # Prefer IRSA (IAM Roles for Service Accounts) in EKS; the
        # secretRef below is the static-credentials fallback.
        secretRef:
          accessKeyIDSecretRef:
            name: awssm-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: awssm-credentials
            key: secret-access-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nexusai-secrets
  namespace: nexusai
  labels:
    app.kubernetes.io/part-of: nexusai-talent-os
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: nexusai-aws-secretsmanager
    kind: SecretStore
  target:
    # ESO will create/own a Secret with this exact name + Opaque type,
    # matching what backend.yaml/celery-worker.yaml reference.
    name: nexusai-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  # Map individual keys from one or more manager secrets.
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: nexusai/prod/app          # AWS secret name
        property: JWT_SECRET           # JSON property within it
    - secretKey: SECRET_KEY
      remoteRef:
        key: nexusai/prod/app
        property: SECRET_KEY
    - secretKey: DATABASE_URL
      remoteRef:
        key: nexusai/prod/db
        property: DATABASE_URL
    - secretKey: POSTGRES_USER
      remoteRef:
        key: nexusai/prod/db
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: nexusai/prod/db
        property: POSTGRES_PASSWORD
    - secretKey: POSTGRES_DB
      remoteRef:
        key: nexusai/prod/db
        property: POSTGRES_DB
    - secretKey: LLM_API_KEY
      remoteRef:
        key: nexusai/prod/llm
        property: LLM_API_KEY
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: nexusai/prod/llm
        property: OPENAI_API_KEY
---
# ── Option B: HashiCorp Vault (KV v2) ────────────────────────────────
# Delete Option A above if you use this instead. Shown for reference.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: nexusai-vault
  namespace: nexusai
  labels:
    app.kubernetes.io/part-of: nexusai-talent-os
spec:
  provider:
    vault:
      server: "https://vault.example.com:8200"   # <-- your Vault address
      path: "secret"                              # KV v2 mount path
      version: "v2"
      auth:
        # Kubernetes auth method: ESO authenticates with this SA's token.
        kubernetes:
          mountPath: "kubernetes"
          role: "nexusai"
          serviceAccountRef:
            name: nexusai-backend
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nexusai-secrets-vault
  namespace: nexusai
  labels:
    app.kubernetes.io/part-of: nexusai-talent-os
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: nexusai-vault
    kind: SecretStore
  target:
    name: nexusai-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  # Pull ALL keys from a single Vault KV path in one shot.
  dataFrom:
    - extract:
        key: nexusai/prod   # secret/data/nexusai/prod in KV v2
