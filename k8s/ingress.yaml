# Ingress for NexusAI Talent OS (nginx ingress controller).
#
# Routing:
#   /api -> backend service (port 8000)
#   /    -> frontend service (port 3000)
#
# TLS is issued by cert-manager. Requires:
#   - ingress-nginx installed in the cluster
#   - cert-manager + a ClusterIssuer named "letsencrypt-prod" (or edit below)
#   - DNS A/AAAA record for the host pointing at the ingress LB
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexusai
  namespace: nexusai
  labels:
    app.kubernetes.io/part-of: nexusai-talent-os
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Allow larger uploads (resumes / video) — matches MAX/VIDEO size config.
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        # Replace with your real host (must match configmap APP/API_BASE_URL).
        - nexusai.example.com
      secretName: nexusai-tls
  rules:
    - host: nexusai.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
