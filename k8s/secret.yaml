# =====================================================================
#  SECRETS — REPLACE ALL PLACEHOLDER VALUES BEFORE DEPLOYING.
# =====================================================================
# This file uses `stringData` (plaintext-in, base64 handled by Kubernetes)
# only so the placeholders are readable. DO NOT commit real secrets here.
#
# In real production use a secret manager instead of a checked-in file:
#   - Sealed Secrets (bitnami-labs/sealed-secrets)
#   - External Secrets Operator (AWS Secrets Manager / GCP SM / Vault)
#   - SOPS-encrypted manifests
#
# DATABASE_URL must match the Postgres credentials in postgres.yaml
# (POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB) and use the in-cluster
# host "postgres" (the headless Service name).
apiVersion: v1
kind: Secret
metadata:
  name: nexusai-secrets
  namespace: nexusai
  labels:
    app.kubernetes.io/part-of: nexusai-talent-os
type: Opaque
stringData:
  # ── Required ────────────────────────────────────────────────────────────
  # Generate: openssl rand -base64 48
  JWT_SECRET: "REPLACE_ME_with_a_long_random_string"
  SECRET_KEY: "REPLACE_ME_with_a_long_random_string"

  # asyncpg driver. Host "postgres" = headless Service in postgres.yaml.
  # Keep user/pass/db in sync with postgres.yaml & the *_DB keys below.
  DATABASE_URL: "postgresql+asyncpg://nexusai:REPLACE_DB_PASSWORD@postgres:5432/nexusai_talent"

  # Postgres bootstrap creds (consumed by postgres.yaml StatefulSet).
  POSTGRES_USER: "nexusai"
  POSTGRES_PASSWORD: "REPLACE_DB_PASSWORD"
  POSTGRES_DB: "nexusai_talent"

  # LLM / AI providers
  LLM_API_KEY: "REPLACE_ME_openrouter_or_llm_key"
  OPENAI_API_KEY: "REPLACE_ME_openai_key"

  # ── Optional provider credentials (uncomment + fill as needed) ──────────
  # ELEVENLABS_API_KEY: ""
  # HUGGINGFACE_TOKEN: ""
  #
  # # AWS / S3 / R2 object storage
  # AWS_ACCESS_KEY_ID: ""
  # AWS_SECRET_ACCESS_KEY: ""
  # R2_ENDPOINT_URL: ""
  #
  # # SMTP email
  # SMTP_USERNAME: ""
  # SMTP_PASSWORD: ""
  #
  # # Twilio SMS
  # TWILIO_ACCOUNT_SID: ""
  # TWILIO_AUTH_TOKEN: ""
  # TWILIO_FROM_NUMBER: ""
  #
  # # Google OAuth / Calendar / BigQuery
  # GOOGLE_CLIENT_ID: ""
  # GOOGLE_CLIENT_SECRET: ""
  # GOOGLE_APPLICATION_CREDENTIALS: ""   # path to mounted creds file
  #
  # # Microsoft OAuth / Outlook
  # MS_CLIENT_ID: ""
  # MS_CLIENT_SECRET: ""
  #
  # # LiveKit realtime
  # LIVEKIT_API_KEY: ""
  # LIVEKIT_API_SECRET: ""
  #
  # # Observability
  # SENTRY_DSN: ""
  #
  # # Judge0 code execution
  # JUDGE0_API_KEY: ""
