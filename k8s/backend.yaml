# FastAPI backend API for NexusAI Talent OS.
#
# Migrations: an initContainer runs `alembic upgrade head` before the app
# starts. This is simple and keeps schema in lockstep with rollouts. The
# trade-off is that with 2 replicas both pods run the initContainer; alembic
# takes a lock so this is safe but the second run is a no-op. For larger
# clusters prefer a dedicated migration Job (see README) so migrations run
# exactly once per release.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: nexusai
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: nexusai-talent-os
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: nexusai
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: nexusai-talent-os
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: nexusai-talent-os
      annotations:
        # Prometheus scrape config for the /metrics endpoint.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: nexusai/backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: nexusai-config
            - secretRef:
                name: nexusai-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: backend
          image: nexusai/backend:latest
          command:
            ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: nexusai-config
            - secretRef:
                name: nexusai-secrets
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            # App writes only to /tmp (mounted below); root FS stays read-only.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
