# =====================================================================
#  Dedicated ServiceAccount for the backend (and celery-worker).
# =====================================================================
# By default every pod uses the namespace's `default` ServiceAccount and
# auto-mounts its API token. The NexusAI backend does NOT talk to the
# Kubernetes API, so it should run under a dedicated, least-privilege SA
# with the token auto-mount DISABLED — nothing to steal, no API reach.
#
# `automountServiceAccountToken: false` here stops the token from being
# projected into pods that use this SA.
#
# ── WIRING (do this in backend.yaml AND celery-worker.yaml) ──────────
# Add to each Deployment's pod template spec (same level as `containers`):
#
#   spec:
#     template:
#       spec:
#         serviceAccountName: nexusai-backend
#         automountServiceAccountToken: false   # belt-and-suspenders
#         securityContext:
#           ...
#         containers:
#           ...
#
# Setting automountServiceAccountToken at BOTH the SA and the pod level is
# redundant-but-explicit; either alone is sufficient.
#
# No Role/RoleBinding is created: the backend needs ZERO Kubernetes API
# permissions. If a future feature needs API access, add a narrowly-scoped
# Role + RoleBinding here rather than widening the default SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexusai-backend
  namespace: nexusai
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: nexusai-talent-os
automountServiceAccountToken: false
